# One-time helper: generates a Unity license request (.alf) as a downloadable artifact.
# Upload it at https://license.unity3d.com/manual, then paste the returned .ulf text
# into the UNITY_LICENSE repo secret. NOTE: Unity may no longer offer Personal manual activation.
name: Unity license request

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/unity-request-license.yml"]

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - id: request
        uses: game-ci/unity-activate@v4
        with:
          unityVersion: 6000.4.11f1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-license-request
          path: "*.alf"
          if-no-files-found: warn
