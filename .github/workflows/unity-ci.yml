# Headless Unity compile + EditMode tests via GameCI.
# Needs repo secrets: UNITY_LICENSE (contents of a Personal .ulf file), UNITY_EMAIL, UNITY_PASSWORD.
name: Unity CI

on:
  push:
    branches: ["claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.4.11f1

jobs:
  check-license:
    runs-on: ubuntu-latest
    outputs:
      has_license: ${{ steps.check.outputs.has_license }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then echo "has_license=true" >> "$GITHUB_OUTPUT"
          else echo "has_license=false" >> "$GITHUB_OUTPUT"
               echo "::warning::UNITY_LICENSE secret is not set; skipping Unity jobs."; fi

  editmode:
    needs: check-license
    if: needs.check-license.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ env.UNITY_VERSION }}-
      - uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-results
          path: artifacts

  validation:
    name: validate ${{ matrix.method }}
    needs: check-license
    if: needs.check-license.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        method:
          - WeatherMathValidation.Run
          - ShuntaMetroGameplayTest.Run
          - ShuntaSkybridgeTest.Run
          # ShuntaNpcLightingValidation.Run is excluded: it asserts Shader.isSupported,
          # which needs a GPU; the CI runner has none (failed on the first check, run #9).
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ env.UNITY_VERSION }}-
      # Runs the project's own batch method; it exits non-zero if any check fails.
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: ${{ matrix.method }}
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs-${{ matrix.method }}
          path: build
          if-no-files-found: ignore
